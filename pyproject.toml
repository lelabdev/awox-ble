[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awox-ble"
version = "0.1.0"
description = "Fast local AwoX / EGLO BLE lighting with a warm Unix-socket daemon"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["awox-mesh>=1.2.1"]

[project.scripts]
light = "awox_ble.cli:main"
awox-ble-daemon = "awox_ble.daemon:main"

[tool.uv.sources]
awox-mesh = { git = "https://github.com/paul-schoettl/awox-mesh.git", rev = "3a46539588b96a2dd705e1cee13a238cabce58e7" }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/awox_ble"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
