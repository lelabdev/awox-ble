name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install pinned dependencies
        run: uv sync --locked --group dev
      - name: Unit tests (no real lamp required)
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check .
